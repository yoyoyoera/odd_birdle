name: Android debug APK

on:
  push:
    branches:
      - 'claude/**'
      - main
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
      - 'scripts/**'
      - '*.js'
      - '*.mjs'
      - '*.html'
      - '*.css'
      - 'fonts/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: android-app/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            android-app/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Build the app web bundle (portal/app)
        run: node scripts/build-portal.mjs app

      - name: Install Capacitor
        working-directory: android-app
        run: npm ci

      - name: Copy web assets into the Android project
        working-directory: android-app
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Check targetSdk >= 36
        id: apk
        run: |
          apk=android-app/android/app/build/outputs/apk/debug/app-debug.apk
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          badging="$("$aapt2" dump badging "$apk")"
          echo "$badging" | grep -E "^(package|minSdkVersion|targetSdkVersion|sdkVersion):"
          target="$(echo "$badging" | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p")"
          if [ -z "$target" ] || [ "$target" -lt 36 ]; then
            echo "::error::targetSdkVersion is '${target:-missing}', must be at least 36"
            exit 1
          fi
          echo "targetSdkVersion $target OK"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: odd-birdle-debug-${{ steps.apk.outputs.short_sha }}
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

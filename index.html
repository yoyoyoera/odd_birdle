  <style>
    :root { --page: #182223; --court: #e8ebd6; --ink: #274d3b;
      --page-hover: #293737; --court-hover: #d7dec6; }
    * { box-sizing: border-box; }

    /* On the phone menu the buttons sit on the dark page: quiet tiles only a little lighter than it, with bright words. */
    html[data-pad] #pad-menu button { border: 0; color: var(--court); font: inherit; font-weight: 650; cursor: pointer; min-height: 0; padding: 0; }
    html[data-pad] #pad-menu #menu-modes > button, html[data-pad] #pad-menu #menu-modes #cpu { background: color-mix(in srgb, var(--court) 13%, var(--page)); width: 100%; }

    html[data-pad] #pad-menu #teaser-rule { font-size: 12px; margin-bottom: 12px; }

    html[data-pad] #pad-menu #daily-button { height: 52px; font-size: 16px; margin-top: 14px; gap: 8px; }
    html[data-pad][data-pad-view="solo"] #pad-tune { display: flex; align-items: center; gap: 10px; box-sizing: border-box; width: calc(100% - 24px); margin: 8px 12px 0;
      color: var(--court); font-size: 11px; font-weight: 650; letter-spacing: .12em; }
    /* The sensitivity bar in the game's own flat style: a thin line and a square handle, no system look. */
    #pad-tune input { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 32px; margin: 0; background: transparent; cursor: pointer; touch-action: pan-x; }
    #pad-tune input::-webkit-slider-runnable-track { height: 4px; background: color-mix(in srgb, var(--court) 40%, transparent); border-radius: 0; }
    #pad-tune input::-moz-range-track { height: 4px; background: color-mix(in srgb, var(--court) 40%, transparent); border-radius: 0; }
    #pad-tune input::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 28px; margin-top: -12px; border: 0; border-radius: 0; background: var(--court); }
    #pad-tune input::-moz-range-thumb { width: 16px; height: 28px; border: 0; border-radius: 0; background: var(--court); }
    #pad-tune input:focus-visible { outline: 2px solid var(--court); outline-offset: 2px; }

    #pad-tune output { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; opacity: .8; }
    /* Thumb pad (Reddit, touch, portrait): the court stays on top and the rest of the page is where the thumb moves. */
    html[data-pad] body { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; place-items: initial; }
    html[data-pad] main { width: 100%; padding-block: 0; }
    #pad { display: none; }
    html[data-pad] #pad { display: grid; place-items: center; align-content: center; gap: 10px; box-sizing: border-box; width: calc(100% - 24px); margin: 12px;
      border: 2px dashed color-mix(in srgb, var(--court) 28%, transparent); border-radius: 22px; color: var(--court); touch-action: none;
      -webkit-user-select: none; user-select: none; cursor: grab; }
    html[data-pad] #pad[hidden] { display: none; }
    #pad-hint { margin: 0; max-width: 16em; text-align: center; font-size: 14px; font-weight: 650; letter-spacing: .04em; opacity: .75; }
    #pad[data-used] #pad-icon { opacity: .22; }
    #pad[data-used] #pad-hint { opacity: .28; }
    #pad[data-held] { border-color: color-mix(in srgb, var(--court) 60%, transparent); }
    /* Phones on their side, and any wide window too short for the court plus a row below it (a portal's embed
       frame is often about 740x390): the buttons move to a column beside the court, so nothing is cut off. */
    @media (orientation: landscape) and ((pointer: coarse) or (max-height: 620px)) {
      main { display: grid; grid-template-columns: minmax(0, 1fr) 44px; align-items: center;
        column-gap: 8px; width: min(992px, 100% - 24px, calc((100svh - 12px) * 1.8 + 52px));
        padding-block: 6px; }
      #studio-links { flex-direction: column; margin-top: 0; }
      /* More specific than the plain .link rules below, which come later. The words sit under the bars in two short

      #studio-links .link { flex-direction: column; height: auto; min-height: 44px; gap: 2px; padding: 6px 0; }
      #studio-links .link b { position: static; transform: none; width: 44px; white-space: normal; text-align: center;
        font-size: .6rem; line-height: 1.15; letter-spacing: 0; }
    }
    /* The Reddit app plays against the computer only: no rooms, no online play, so no connection bars either. */
    [data-portal="reddit"] #quick, [data-portal="reddit"] #create, [data-portal="reddit"] #join,
    [data-portal="reddit"] #join-form, [data-portal="reddit"] .link { display: none !important; }
    /* Reddit's expanded post is a small, nearly square frame: the court takes the full width and the buttons sit
       in a row under it, unless the frame is really wide and short (a phone on its side). */
    /* The only button left, sound, sits on the court's floor corner, so the page is just the court, centred. */
    [data-portal="reddit"] main { display: grid; grid-template-columns: minmax(0, 1fr); column-gap: 0; padding-block: 0; width: min(940px, 100% - 8px, (100svh - 4px) * 1.8); }
    [data-portal="reddit"] #stage, [data-portal="reddit"] #studio-links { grid-area: 1 / 1; }
    [data-portal="reddit"] #studio-links { align-self: end; justify-self: end; margin: 0 4px 4px 0; z-index: 2; }
    [data-portal="reddit"] #sound-toggle { color: var(--ink); opacity: .55; }
    [data-portal="reddit"] #sound-toggle:hover { opacity: 1; background: transparent; }

      [data-portal="reddit"] main { display: grid; width: calc(100% - 8px); padding-block: 4px; }
      [data-portal="reddit"] #studio-links { flex-direction: row; margin-top: 0; }
      [data-portal="reddit"] #studio-links .link { flex-direction: row; height: 44px; min-height: 0; gap: 6px; padding: 0 4px; }
      [data-portal="reddit"] #studio-links .link b { position: absolute; transform: translateX(-50%); width: auto;
        white-space: nowrap; font-size: .75rem; line-height: normal; letter-spacing: 0; }
    }
    /* A flat, scrollable stage sheet fits even Reddit's smallest inline court. */
    [data-portal="reddit"] #stage-panel { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column;
      padding: 8px; background: var(--court); color: var(--ink); cursor: default; }
    [data-portal="reddit"] #stage-panel header { flex: 0 0 auto; min-height: 44px; padding: 0 12px 0 48px;
      display: flex; align-items: center; gap: 10px; }
    /* How many of the twenty are cleared: a notch smaller than the title, with a thin bar under the row. */

    [data-portal="reddit"] #stage-count { display: block; font-size: clamp(15px, 3.2vw, 20px); font-weight: 650;

    [data-portal="reddit"] #stage-bar { flex: 0 0 auto; height: 3px; margin: 0 12px 4px 48px; background: color-mix(in srgb, var(--ink) 15%, transparent); }

    [data-portal="reddit"] #stage-panel h2 { margin: 0; font-size: clamp(16px, 3.5vw, 24px); line-height: 1.15; }
    [data-portal="reddit"] #stage-progress { display: block; margin: 3px 0 0; font-size: 9px; letter-spacing: .08em; opacity: .65; text-transform: uppercase; }
    /* The stages are cards in two rows that slide sideways (swipe, drag the bar, wheel or the arrow buttons). */
    [data-portal="reddit"] #stage-panel { overflow: hidden; }
    [data-portal="reddit"] #stage-list { flex: 1 1 auto; min-height: 0; display: grid; grid-auto-flow: column;
      grid-template-rows: repeat(2, minmax(0, 1fr)); grid-auto-columns: clamp(132px, 31%, 200px); gap: 6px;
      overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; touch-action: pan-x;
      scrollbar-width: thin; padding: 2px 2px 6px; }
    [data-portal="reddit"] #stage-list button { display: flex; flex-direction: column; align-items: stretch; gap: 2px; min-height: 0; overflow: hidden;
      padding: 6px 9px 7px; text-align: left; border: 0; color: var(--ink); font: inherit;

    [data-portal="reddit"] #stage-list button:hover { background: var(--court-hover); }

      font-size: max(9px, 2.1cqw); letter-spacing: .14em; background: var(--ink); color: var(--court); }
    [data-portal="reddit"] #daily-icon:not([hidden]) { display: block; width: 2.4cqw; height: 2.4cqw; }
    [data-portal="reddit"] #daily-button:hover:not(:disabled) { background: color-mix(in srgb, var(--ink) 82%, var(--court)); }
    [data-portal="reddit"] #daily-button:disabled { opacity: .55; cursor: default; }
    /* Small frames (a phone held upright) show the first three only. */
    @container (max-width: 420px) { [data-portal="reddit"] #teaser-board li:nth-child(n+4) { display: none; } }
    [data-portal="reddit"] #stage-intro { position: absolute; inset: 0; z-index: 3; display: grid; place-content: center;
      padding: 20px 48px; text-align: center; background: var(--court); color: var(--ink); pointer-events: none; }
    [data-portal="reddit"] #stage-intro-number { margin: 0 0 6px; opacity: .65; font-size: 12px; letter-spacing: .12em; }
    [data-portal="reddit"] #stage-intro-name { margin: 0; font-size: clamp(22px, 5vw, 40px); line-height: 1.1; }
    [data-portal="reddit"] #stage-intro-goal { margin: 12px 0 0; font-size: clamp(12px, 3vw, 18px); font-weight: 650; letter-spacing: .12em; }
    [data-portal="reddit"] #stage-intro-description { margin: 9px 0 0; font-size: clamp(11px, 2.7vw, 16px); line-height: 1.4; }
    canvas { display: block; width: 100%; aspect-ratio: 9 / 5; background: var(--court);
      touch-action: none; cursor: none; }
    #stage[data-phase="ready"] canvas, #stage[data-phase="finished"] canvas { cursor: default; }
    #score { position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%);
      color: var(--ink); opacity: .45; font-size: clamp(1.5rem, 6vw, 3.5rem); font-weight: 650; line-height: 1;
      font-variant-numeric: tabular-nums; pointer-events: none; }
    #stage[data-phase="ready"] #score, #stage[data-phase="finished"] #score { opacity: 1; }
    /* Reddit: what the match is played to, small under the score while it is on. */
    #goal { position: absolute; left: 50%; top: calc(50% + clamp(1.1rem, 4.4vw, 2.5rem)); transform: translateX(-50%); margin: 0;
      color: var(--ink); opacity: .45; font-size: clamp(.6rem, 1.6vw, .8rem); font-weight: 650; letter-spacing: .14em;
      white-space: nowrap; pointer-events: none; }
    #goal[hidden], #stage[data-phase="ready"] #goal, #stage[data-phase="finished"] #goal { display: none; }
    #side-label, #cpu-label { position: absolute; top: 5%; left: 25%; transform: translateX(-50%);
      color: var(--ink); font-size: clamp(.65rem, 1.7vw, .875rem); font-weight: 650;
      letter-spacing: .08em; pointer-events: none; }
    #side-label[data-side="right"], #cpu-label { left: 75%; }
    #cpu-label[data-side="left"] { left: 25%; }
    [data-portal="reddit"] #doubles-turn { position: absolute; top: 12%; left: 25%; transform: translateX(-50%);
      color: var(--ink); font-size: clamp(.6rem, 1.7vw, .8rem); font-weight: 650; white-space: nowrap; pointer-events: none; }
    [data-portal="reddit"] #doubles-turn[data-side="right"] { left: 75%; }
    /* For a moment as each match starts: which half is yours (it changes from match to match). */
    #you-flag { position: absolute; top: 50%; left: 25%; transform: translate(-50%, -50%); color: var(--ink);
      font-size: clamp(1.5rem, 7vw, 4rem); font-weight: 650; letter-spacing: .08em; pointer-events: none;
      animation: you-flag 1.8s ease-in forwards; }
    #you-flag[data-side="right"] { left: 75%; }
    @keyframes you-flag { 0%, 70% { opacity: .9; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #you-flag { animation: none; opacity: .9; } }
    /* Connection bars (online only), beside the sound button under the court: out of the way of play. */
    .link { display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 44px; height: 44px;
      padding: 0 4px; color: var(--court); font-size: .8rem; font-weight: 650; letter-spacing: .06em; cursor: default; }
    .link .bars { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
    .link i { width: 3px; background: currentColor; opacity: .2; }
    .link i:nth-child(1) { height: 6px; } .link i:nth-child(2) { height: 10px; } .link i:nth-child(3) { height: 14px; }
    .link[data-level="1"] i:nth-child(1), .link[data-level="2"] i:nth-child(-n+2), .link[data-level="3"] i { opacity: .85; }
    .link { position: relative; }
    .link:hover { background: var(--page-hover); }
    /* The details float under the bars, so showing them never moves the buttons around the bars. */
    .link b { position: absolute; top: calc(100% + 2px); left: 50%; transform: translateX(-50%); font-size: .75rem;
      font-weight: 650; opacity: .85; white-space: nowrap; pointer-events: none; }
    #winner { position: absolute; bottom: calc(50% + clamp(1rem, 5vw, 2.25rem)); left: 50%;
      transform: translateX(-50%); margin: 0; color: var(--ink);
      font-size: clamp(1rem, 3.8vw, 1.75rem); font-weight: 650; white-space: nowrap; pointer-events: none; }
    #record { position: absolute; bottom: calc(50% + clamp(2.6rem, 10.5vw, 5rem)); left: 50%;
      transform: translateX(-50%); margin: 0; color: var(--ink); opacity: .6; font-size: clamp(.65rem, 1.7vw, .875rem);
      font-weight: 650; letter-spacing: .08em; white-space: nowrap; pointer-events: none; }
    #rematch-status { position: absolute; top: calc(50% + clamp(1rem, 4vw, 2rem) + 52px); left: 50%;
      transform: translateX(-50%); margin: 0; width: max-content; max-width: 95%; padding: .15rem .5rem;
      text-align: center; color: var(--ink); background: var(--court);
      font-size: clamp(.65rem, 1.8vw, .9rem); line-height: 1.3; font-weight: 650; pointer-events: none; }
    #event-banner { position: absolute; top: 7%; left: 50%; transform: translateX(-50%);
      color: var(--ink);
      font-size: clamp(1.25rem, 5.5vw, 3.25rem); line-height: 1.05;
      font-weight: 650; white-space: nowrap; pointer-events: none; }
    #event-banner[data-wind] { font-size: clamp(1.4rem, 6vw, 3.6rem); }
    #stage[data-phase="ready"] #event-banner { top: 33.5%; transform: translate(-50%, -50%); opacity: .75;
      font-size: clamp(.75rem, 3.2vw, 1.9rem); }
    #game-control { position: absolute; top: 8px; right: 8px; display: grid; place-items: center;
      width: 44px; height: 44px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
    #game-control:hover { background: var(--court-hover); }
    #game-control:focus-visible { outline: 2px solid currentColor; outline-offset: -3px; }
    #stage[data-phase="ready"] #game-control {
      top: calc(50% + clamp(1rem, 4vw, 2rem)); right: auto; left: 50%; transform: translateX(-50%); }
    /* After a match: plain words to play again or leave, on a court-coloured backing so the net never hides them. */
    #result-actions { position: absolute; top: calc(50% + clamp(1rem, 4vw, 2rem)); left: 50%; transform: translateX(-50%);
      display: flex; gap: clamp(4px, 2vw, 16px); white-space: nowrap; }
    #result-actions[hidden] { display: none; }
    #result-actions button { border: 2px solid var(--ink); background: var(--court); color: var(--ink);
      min-height: 44px; padding: 0 12px; font: inherit; font-weight: 650; cursor: pointer; }
    #result-actions button:hover { background: var(--court-hover); }
    #result-actions button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
    /* The end-of-match buttons carry a word and an icon in the markup. Everywhere but Reddit the word shows; on Reddit
       they are icon tiles (the words stay as labels for screen readers and tooltips), faintly tinted, fully tinted
       under the pointer. */
    #result-actions .icon, #result-actions [data-posted] { display: none; }
    [data-portal="reddit"] #result-actions { gap: 8px; }
    [data-portal="reddit"] #result-actions .icon { display: block; }
    [data-portal="reddit"] #result-actions .label { display: none; }
    [data-portal="reddit"] #result-actions [data-posted] { display: none; }
    [data-portal="reddit"] #result-actions button { display: grid; place-items: center; width: 44px; height: 44px; min-height: 0; padding: 0;
      border: 0; background: color-mix(in srgb, var(--court-hover) 55%, var(--court)); }
    [data-portal="reddit"] #result-actions button:hover:not(:disabled) { background: var(--court-hover); }
    [data-portal="reddit"] #result-actions button[hidden] { display: none; }
    [data-portal="reddit"] #card-button[data-state="posting"] { opacity: .6; cursor: default; animation: card-pulse 1s ease-in-out infinite; }
    [data-portal="reddit"] #card-button[data-state="posted"] .icon:not([data-posted]) { display: none; }
    [data-portal="reddit"] #card-button[data-state="posted"] [data-posted] { display: block; }
    [data-portal="reddit"] #card-button[data-state="failed"] { outline: 2px solid currentColor; outline-offset: -3px; }
    @keyframes card-pulse { 50% { opacity: .35; } }
    #result-actions #card-button:disabled { cursor: default; }
    #result-actions #card-button[hidden] { display: none; }
    #menu, #join-form, #room-display { position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); white-space: nowrap; }
    #menu, #join-form { display: flex; align-items: center; gap: clamp(4px, 2vw, 16px); }
    /* The level option hangs under CPU without moving the menu row. */
    #cpu-group { position: relative; }
    #menu #cpu-level { position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      min-height: 32px; font-size: .75rem; letter-spacing: .04em; opacity: .7; white-space: nowrap; }
    #menu #cpu-level:hover, #menu #cpu-level:focus-visible { opacity: 1; }
    #join-form { flex-wrap: wrap; justify-content: center; width: min(96%, 420px); }
    #room-display { text-align: center; color: var(--ink); }
    #room-display > span { display: block; font-size: clamp(.75rem, 2vw, 1rem); }
    #room-code { display: block; font-size: clamp(1.6rem, 8vw, 4rem); font-weight: 650; letter-spacing: .12em; color: var(--ink); }
    #copy-link { display: block; margin: 4px auto 0; min-width: 9em; }
    #menu button, #join-form button, #back, #copy-link { border: 0; background: transparent;
      color: var(--ink); min-height: 44px; padding: 0 8px; font: inherit; font-weight: 650; cursor: pointer; }
    #menu button:hover, #join-form button:hover, #back:hover, #copy-link:hover { background: var(--court-hover); }
    #join-form label { color: var(--ink); }
    #code-input { min-width: 0; width: 7.5em; background: transparent; border: 0; border-bottom: 1px solid var(--ink);
      color: var(--ink); text-transform: uppercase; font: inherit; }
    #back { position: absolute; top: 8px; left: 8px; min-width: 44px; }
    /* One fixed spot above the score, clear of the countdown banner and the You Win / restart
       buttons, so it never moves between the rally and the results screen. No backing box:
       a shuttle flying behind it must stay visible. */
    #queue-status { position: absolute; top: 24%; left: 50%; transform: translateX(-50%); margin: 0;
      color: var(--ink); font-size: clamp(.8rem, 2.2vw, 1.15rem); font-weight: 650; letter-spacing: .06em;
      text-shadow: 0 0 3px var(--court), 0 0 3px var(--court), 0 0 6px var(--court);
      white-space: nowrap; pointer-events: none; animation: searching 1.6s ease-in-out infinite; }
    @keyframes searching { 50% { opacity: .5; } }
    @media (prefers-reduced-motion: reduce) { #queue-status { animation: none; } }
    #queue-status[data-found] { animation: none; font-size: clamp(1rem, 3.6vw, 1.75rem); }
    #lobby-message { position: absolute; top: 32%; width: 100%; margin: 0; text-align: center;
      color: var(--ink); font-size: .875rem; pointer-events: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <section id="stage" data-phase="ready" aria-label="Game">
    <h1>ODD BIRDLE</h1>
    <canvas id="court" aria-label="Badminton court. Use your pointer to hit the shuttle."></canvas>
    <output id="score" aria-label="Left and right scores" hidden>0:0</output>
    <p id="goal" hidden></p>
    <span id="side-label" hidden>YOU</span>
    <span id="cpu-label" hidden></span>
    <span id="doubles-turn" hidden role="status"></span>
    <span id="you-flag" aria-hidden="true" hidden>YOU</span>
    <p id="winner" role="status" hidden></p>
    <p id="record" hidden></p>
    <p id="rematch-status" role="status" hidden></p>
    <span id="status" class="sr-only" role="status"></span>
    <div id="event-banner" role="status" hidden></div>
    <p id="queue-status" role="status" hidden></p>
    <nav id="menu" aria-label="Game mode">
      <button id="quick" type="button">QUICK MATCH</button>
      <button id="create" type="button">CREATE</button>
      <button id="join" type="button">JOIN</button>
      <span id="menu-modes">
        <button id="stages-button" type="button" hidden>STAGES</button>
        <span id="cpu-group">
          <button id="cpu" type="button">CPU</button>
          <button id="cpu-level" type="button">LV RANDOM</button>
        </span>
      </span>
      <section id="daily-teaser" aria-label="Daily challenge" hidden>
        <p id="teaser-head"><span id="teaser-day">DAILY</span><span id="teaser-tries"></span></p>
        <h3 id="teaser-name">…</h3>
        <p id="teaser-rule"></p>
        <ol id="teaser-board" aria-label="First to clear today"></ol>
        <button id="daily-button" type="button"><svg id="daily-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 14v5.5h14V14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="daily-label">CHALLENGE</span></button>
      </section>
    </nav>
    <section id="stage-panel" aria-label="Choose a stage" hidden>
      <header>
        <h2>STAGES</h2>
        <div id="stage-score" role="status"><strong id="stage-count">0/20</strong><span id="stage-progress"></span></div>
      </header>
      <div id="stage-bar" aria-hidden="true"><i></i></div>
      <div id="stage-list" aria-label="Available stages"></div>
      <button id="stage-prev" type="button" aria-label="Earlier stages" title="Earlier stages"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="stage-next" type="button" aria-label="Later stages" title="Later stages"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </section>
    <div id="expand-gate" hidden>
      <p>ODD BIRDLE</p>
      <button type="button">TAP TO PLAY</button>
      <span>Opens full screen, so your thumb can slide</span>
    </div>
    <section id="stage-intro" role="status" aria-live="polite" hidden>
      <p id="stage-intro-number"></p><h2 id="stage-intro-name"></h2><p id="stage-intro-description"></p><p id="stage-intro-goal"></p>
    </section>
    <div id="room-display" hidden>
      <span>Room code:</span>
      <output id="room-code" aria-label="Room code" aria-live="polite"></output>
      <button id="copy-link" type="button">COPY LINK</button>
    </div>
    <form id="join-form" novalidate hidden>
      <label for="code-input">Room code</label>
      <input id="code-input" maxlength="6" aria-describedby="lobby-message"
        autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Enter code">
      <button type="submit" aria-label="JOIN">→</button>
    </form>
    <p id="lobby-message" role="status" hidden></p>
    <button id="back" type="button" aria-label="Main menu" title="Main menu" hidden>←</button>
    <button id="game-control" type="button" aria-label="Restart" title="Restart" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 5v5h5M4.7 10a7.5 7.5 0 1 1 .7 7" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div id="result-actions" hidden>
      <button id="play-again" type="button" aria-label="Play again" title="Play again"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v5h5M4.7 10a7.5 7.5 0 1 1 .7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label">PLAY AGAIN</span></button>
      <button id="next-stage" type="button" aria-label="Next stage" title="Next stage" hidden><svg class="icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6l7 6-7 6M13 6l7 6-7 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label">NEXT</span></button>
      <button id="result-stages" type="button" aria-label="Stages" title="Stages" hidden><svg class="icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label">STAGES</span></button>
      <button id="to-menu" type="button" aria-label="Menu" title="Menu"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7M6 10v10h12V10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label">MENU</span></button>
      <button id="card-button" type="button" aria-label="Post card" title="Post card" hidden><svg class="icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 14v5.5h14V14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" data-posted><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="card-label" class="label">POST CARD</span></button>
    </div>
    <div id="pause-overlay" role="status" aria-live="polite" hidden>
      <div><h2 id="pause-title">PAUSED</h2><p id="pause-detail">Resume to continue.</p></div>
    </div>
  </section>
  <!-- The overlay has no online pause/resume controls; the portal owns its pause signal. -->
  <nav id="studio-links" aria-label="studiyo links and sound">
    <a href="https://studiyo.pages.dev/" target="_blank" rel="noopener"
      aria-label="studiyo website (opens in a new tab)" title="studiyo website">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.6" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <ellipse cx="12" cy="12" rx="4" ry="9"/>
        <path d="M3 12h18"/>
      </svg>
    </a>
    <a href="https://www.instagram.com/studiyo_official/" target="_blank" rel="noopener"
      aria-label="studiyo Instagram (opens in a new tab)" title="studiyo Instagram">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.6" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </a>
    <div id="link-own" class="link"><span class="bars"><i></i><i></i><i></i></span><b></b></div>
    <button id="sound-toggle" type="button" aria-pressed="false" aria-label="Mute sound" title="Mute sound">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
        <path class="on" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" stroke-linecap="round"/>
        <path class="muted" d="M16 9.5l5 5M21 9.5l-5 5" stroke-linecap="round"/>
      </svg>
    </button>
  </nav>
</main>
<!-- A phone held upright (Reddit): the space under the court is a thumb pad; the racket follows the thumb's movement. -->
<div id="pad-menu" hidden></div>
<div id="pad-tune" hidden>
  <label for="pad-gain">SENSITIVITY</label>
  <input id="pad-gain" type="range" min="0.8" max="3" step="0.05" value="1.5" aria-label="Thumb pad sensitivity">
  <output id="pad-gain-value" for="pad-gain">1.5×</output>
</div>
<div id="pad" hidden aria-label="Thumb pad: slide to move your racket">
  <svg id="pad-icon" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="9" fill="currentColor" opacity=".9"/>
    <path d="M32 6v12M32 46v12M6 32h12M46 32h12M32 6l-5 6M32 6l5 6M32 58l-5-6M32 58l5-6M6 32l6-5M6 32l6 5M58 32l-6-5M58 32l-6 5"
      fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
  </svg>
  <p id="pad-hint">Slide your thumb here to move your racket</p>
</div>
<script type="module" src="./client.js"></script>
</body>
</html>

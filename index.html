<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odd Birdle — 배드민턴</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@650&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center;
      background: #182223; font: 16px "Space Grotesk", system-ui, sans-serif; }
    main { position: relative; width: min(940px, 100% - 32px); }
    canvas { display: block; width: 100%; aspect-ratio: 9 / 5; background: #e8ebd6;
      touch-action: none; cursor: none; }
    main[data-phase="ready"] canvas, main[data-phase="finished"] canvas { cursor: default; }
    #score { position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%);
      color: #274d3b; opacity: .45; font-size: clamp(1.5rem, 6vw, 3.5rem); font-weight: 650; line-height: 1;
      font-variant-numeric: tabular-nums; pointer-events: none; }
    main[data-phase="ready"] #score, main[data-phase="finished"] #score { opacity: 1; }
    #winner { position: absolute; bottom: calc(50% + clamp(1rem, 5vw, 2.25rem)); left: 50%;
      transform: translateX(-50%); margin: 0; color: #274d3b;
      font-size: clamp(1rem, 3.8vw, 1.75rem); font-weight: 650; white-space: nowrap; pointer-events: none; }
    #event-banner { position: absolute; top: 7%; left: 50%; transform: translateX(-50%);
      color: #274d3b; background: #e8ebd6; padding: 3px 7px;
      font-size: clamp(1.25rem, 5.5vw, 3.25rem); line-height: 1.05;
      font-weight: 650; white-space: nowrap; pointer-events: none; }
    #event-banner[data-wind] { font-size: clamp(1.4rem, 6vw, 3.6rem); }
    #game-control { position: absolute; top: 8px; right: 8px; display: grid; place-items: center;
      width: 44px; height: 44px; border: 0; background: #e8ebd6; color: #274d3b; cursor: pointer; }
    #game-control:hover { background: #d7dec6; }
    #game-control:focus-visible { outline: 2px solid currentColor; outline-offset: -3px; }
    main[data-phase="ready"] #game-control, main[data-phase="finished"] #game-control {
      top: calc(50% + clamp(1rem, 4vw, 2rem)); right: auto; left: 50%; transform: translateX(-50%); }
    #menu, #join-form, #room-code { position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); white-space: nowrap; }
    #menu, #join-form { display: flex; align-items: center; gap: clamp(4px, 2vw, 16px); }
    #join-form { flex-wrap: wrap; justify-content: center; width: min(96%, 420px); }
    #room-code { font-size: clamp(1.6rem, 8vw, 4rem); font-weight: 650; letter-spacing: .12em; color: #274d3b; }
    #menu button, #join-form button, #back { border: 0; background: transparent;
      color: #274d3b; min-height: 44px; padding: 0 8px; font: inherit; font-weight: 650; cursor: pointer; }
    #menu button:hover, #join-form button:hover, #back:hover { background: #d7dec6; }
    #join-form label { color: #274d3b; }
    #code-input { min-width: 0; width: 7.5em; background: transparent; border: 0; border-bottom: 1px solid #274d3b;
      color: #274d3b; text-transform: uppercase; font: inherit; }
    #back { position: absolute; top: 8px; left: 8px; min-width: 44px; }
    #lobby-message { position: absolute; top: 65%; width: 100%; margin: 0; text-align: center;
      color: #274d3b; font-size: .875rem; pointer-events: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main data-phase="ready">
  <canvas id="court" aria-label="마우스나 손가락으로 셔틀을 받아치는 배드민턴 코트"></canvas>
  <output id="score" aria-label="왼쪽과 오른쪽 점수" hidden>0:0</output>
  <p id="winner" role="status" hidden></p>
  <span id="status" class="sr-only" role="status"></span>
  <div id="event-banner" role="status" hidden></div>
  <nav id="menu" aria-label="게임 모드">
    <button id="create" type="button">방 생성</button>
    <button id="join" type="button">참여</button>
    <button id="cpu" type="button">CPU</button>
  </nav>
  <output id="room-code" aria-label="참여 코드" aria-live="polite" hidden></output>
  <form id="join-form" hidden>
    <label for="code-input">참여 코드</label>
    <input id="code-input" required maxlength="6" minlength="6" pattern="[A-Za-z2-9]{6}"
      autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="코드 입력">
    <button type="submit" aria-label="참여">→</button>
  </form>
  <p id="lobby-message" role="status" hidden></p>
  <button id="back" type="button" aria-label="첫 화면" title="첫 화면" hidden>←</button>
  <button id="game-control" type="button" aria-label="다시 시작" title="다시 시작" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 5v5h5M4.7 10a7.5 7.5 0 1 1 .7 7" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</main>
<script type="module" src="./client.js"></script>
</body>
</html>

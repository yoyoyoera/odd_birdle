<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ODD BIRDLE</title>
  <meta name="description" content="Badminton, but the bird is odd. A random 2D badminton game — play a friend or the CPU in your browser.">
  <meta name="theme-color" content="#2b2722">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://oddbirdle.pages.dev/">
  <meta property="og:title" content="ODD BIRDLE">
  <meta property="og:description" content="Badminton, but the bird is odd. Play a friend or the CPU in your browser.">
  <meta property="og:image" content="https://oddbirdle.pages.dev/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ODD BIRDLE: two rackets rallying an oddly shaped shuttle over the net">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@650&amp;display=swap">
  <style>
    :root { --page: #182223; --court: #e8ebd6; --ink: #274d3b;
      --page-hover: #293737; --court-hover: #d7dec6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center;
      background: var(--page); font: 16px "Space Grotesk", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    input { -webkit-user-select: text; user-select: text; }
    /* No links out of the game on CrazyGames. */
    [data-portal="crazygames"] #studio-links a { display: none; }
    main { width: min(940px, 100% - 32px); padding-block: 24px; }
    h1 { position: absolute; top: 17%; left: 50%; transform: translate(-50%, -50%);
      margin: 0; color: var(--ink); text-align: center; white-space: nowrap; pointer-events: none;
      font-size: clamp(2rem, 8vw, 5rem); font-weight: 650; line-height: 1; letter-spacing: -.04em; }
    #stage { position: relative; }
    #stage:not([data-phase="ready"]) h1 { display: none; }
    #studio-links { display: flex; justify-content: center; margin-top: 8px; }
    #studio-links a, #sound-toggle { display: grid; place-items: center; width: 44px; height: 44px; color: var(--court); }
    #sound-toggle { border: 0; padding: 0; background: transparent; cursor: pointer; }
    #studio-links a:hover, #sound-toggle:hover { background: var(--page-hover); }
    #sound-toggle:focus-visible { outline: 2px solid currentColor; outline-offset: -3px; }
    #sound-toggle .muted, #sound-toggle[aria-pressed="true"] .on { display: none; }
    #sound-toggle[aria-pressed="true"] .muted { display: inline; }
    #studio-links a:focus-visible { outline: 2px solid currentColor; outline-offset: -3px; }
    @media (orientation: landscape) and (pointer: coarse) {
      main { display: grid; grid-template-columns: minmax(0, 1fr) 44px; align-items: center;
        column-gap: 8px; width: min(992px, 100% - 24px, calc((100svh - 12px) * 1.8 + 52px));
        padding-block: 6px; }
      #studio-links { flex-direction: column; margin-top: 0; }
    }
    canvas { display: block; width: 100%; aspect-ratio: 9 / 5; background: var(--court);
      touch-action: none; cursor: none; }
    #stage[data-phase="ready"] canvas, #stage[data-phase="finished"] canvas { cursor: default; }
    #score { position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%);
      color: var(--ink); opacity: .45; font-size: clamp(1.5rem, 6vw, 3.5rem); font-weight: 650; line-height: 1;
      font-variant-numeric: tabular-nums; pointer-events: none; }
    #stage[data-phase="ready"] #score, #stage[data-phase="finished"] #score { opacity: 1; }
    #side-label, #cpu-label { position: absolute; top: 5%; left: 25%; transform: translateX(-50%);
      color: var(--ink); font-size: clamp(.65rem, 1.7vw, .875rem); font-weight: 650;
      letter-spacing: .08em; pointer-events: none; }
    #side-label[data-side="right"], #cpu-label { left: 75%; }
    #winner { position: absolute; bottom: calc(50% + clamp(1rem, 5vw, 2.25rem)); left: 50%;
      transform: translateX(-50%); margin: 0; color: var(--ink);
      font-size: clamp(1rem, 3.8vw, 1.75rem); font-weight: 650; white-space: nowrap; pointer-events: none; }
    #event-banner { position: absolute; top: 7%; left: 50%; transform: translateX(-50%);
      color: var(--ink); background: var(--court); padding: 3px 7px;
      font-size: clamp(1.25rem, 5.5vw, 3.25rem); line-height: 1.05;
      font-weight: 650; white-space: nowrap; pointer-events: none; }
    #event-banner[data-wind] { font-size: clamp(1.4rem, 6vw, 3.6rem); }
    #stage[data-phase="ready"] #event-banner { top: 33.5%; transform: translate(-50%, -50%); opacity: .75;
      font-size: clamp(.75rem, 3.2vw, 1.9rem); }
    #game-control { position: absolute; top: 8px; right: 8px; display: grid; place-items: center;
      width: 44px; height: 44px; border: 0; background: var(--court); color: var(--ink); cursor: pointer; }
    #game-control:hover { background: var(--court-hover); }
    #game-control:focus-visible { outline: 2px solid currentColor; outline-offset: -3px; }
    #stage[data-phase="ready"] #game-control, #stage[data-phase="finished"] #game-control {
      top: calc(50% + clamp(1rem, 4vw, 2rem)); right: auto; left: 50%; transform: translateX(-50%); }
    #menu, #join-form, #room-display { position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); white-space: nowrap; }
    #menu, #join-form { display: flex; align-items: center; gap: clamp(4px, 2vw, 16px); }
    /* The level option hangs under CPU without moving the menu row. */
    #cpu-group { position: relative; }
    #menu #cpu-level { position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      min-height: 32px; font-size: .75rem; letter-spacing: .04em; opacity: .7; white-space: nowrap; }
    #menu #cpu-level:hover, #menu #cpu-level:focus-visible { opacity: 1; }
    #join-form { flex-wrap: wrap; justify-content: center; width: min(96%, 420px); }
    #room-display { text-align: center; color: var(--ink); }
    #room-display > span { display: block; font-size: clamp(.75rem, 2vw, 1rem); }
    #room-code { display: block; font-size: clamp(1.6rem, 8vw, 4rem); font-weight: 650; letter-spacing: .12em; color: var(--ink); }
    #copy-link { display: block; margin: 4px auto 0; min-width: 9em; }
    #menu button, #join-form button, #back, #copy-link { border: 0; background: transparent;
      color: var(--ink); min-height: 44px; padding: 0 8px; font: inherit; font-weight: 650; cursor: pointer; }
    #menu button:hover, #join-form button:hover, #back:hover, #copy-link:hover { background: var(--court-hover); }
    #join-form label { color: var(--ink); }
    #code-input { min-width: 0; width: 7.5em; background: transparent; border: 0; border-bottom: 1px solid var(--ink);
      color: var(--ink); text-transform: uppercase; font: inherit; }
    #back { position: absolute; top: 8px; left: 8px; min-width: 44px; }
        /* Just under the score, where the eye already is; on the results screen it moves to the floor. */
    #queue-status { position: absolute; top: calc(50% + clamp(1.3rem, 4.8vw, 2.8rem)); left: 50%; transform: translateX(-50%); margin: 0;
      color: var(--ink); background: var(--court); padding: 2px 8px;
      font-size: clamp(.8rem, 2.2vw, 1.15rem); font-weight: 650; letter-spacing: .06em;
      white-space: nowrap; pointer-events: none; animation: searching 1.6s ease-in-out infinite; }
    @keyframes searching { 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { #queue-status { animation: none; } }
    #stage[data-phase="finished"] #queue-status { top: auto; bottom: 1.2%; }
    #queue-status[data-found] { top: 30%; animation: none; font-size: clamp(1rem, 3.6vw, 1.75rem); }
    #lobby-message { position: absolute; top: 32%; width: 100%; margin: 0; text-align: center;
      color: var(--ink); font-size: .875rem; pointer-events: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <section id="stage" data-phase="ready" aria-label="Game">
    <h1>ODD BIRDLE</h1>
    <canvas id="court" aria-label="Badminton court. Use your pointer to hit the shuttle."></canvas>
    <output id="score" aria-label="Left and right scores" hidden>0:0</output>
    <span id="side-label" hidden>YOU</span>
    <span id="cpu-label" hidden></span>
    <p id="winner" role="status" hidden></p>
    <span id="status" class="sr-only" role="status"></span>
    <div id="event-banner" role="status" hidden></div>
    <p id="queue-status" role="status" hidden></p>
    <nav id="menu" aria-label="Game mode">
      <button id="quick" type="button">QUICK MATCH</button>
      <button id="create" type="button">CREATE</button>
      <button id="join" type="button">JOIN</button>
      <span id="cpu-group">
        <button id="cpu" type="button">CPU</button>
        <button id="cpu-level" type="button">LV RANDOM</button>
      </span>
    </nav>
    <div id="room-display" hidden>
      <span>Room code:</span>
      <output id="room-code" aria-label="Room code" aria-live="polite"></output>
      <button id="copy-link" type="button">COPY LINK</button>
    </div>
    <form id="join-form" novalidate hidden>
      <label for="code-input">Room code</label>
      <input id="code-input" maxlength="6" aria-describedby="lobby-message"
        autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Enter code">
      <button type="submit" aria-label="JOIN">→</button>
    </form>
    <p id="lobby-message" role="status" hidden></p>
    <button id="back" type="button" aria-label="Main menu" title="Main menu" hidden>←</button>
    <button id="game-control" type="button" aria-label="Restart" title="Restart" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 5v5h5M4.7 10a7.5 7.5 0 1 1 .7 7" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </section>
  <nav id="studio-links" aria-label="studiyo links and sound">
    <a href="https://studiyo.pages.dev/" target="_blank" rel="noopener"
      aria-label="studiyo website (opens in a new tab)" title="studiyo website">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.6" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <ellipse cx="12" cy="12" rx="4" ry="9"/>
        <path d="M3 12h18"/>
      </svg>
    </a>
    <a href="https://www.instagram.com/studiyo_official/" target="_blank" rel="noopener"
      aria-label="studiyo Instagram (opens in a new tab)" title="studiyo Instagram">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.6" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </a>
    <button id="sound-toggle" type="button" aria-pressed="false" aria-label="Mute sound" title="Mute sound">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
        <path class="on" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" stroke-linecap="round"/>
        <path class="muted" d="M16 9.5l5 5M21 9.5l-5 5" stroke-linecap="round"/>
      </svg>
    </button>
  </nav>
</main>
<script type="module" src="./client.js"></script>
</body>
</html>

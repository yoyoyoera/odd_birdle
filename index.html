<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odd Birdle — 배드민턴</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #182223; color: #f7f6e9; font: 16px system-ui, sans-serif; }
    main { width: min(940px, 100% - 32px); margin: 32px auto; }
    header, footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    h1 { margin: 4px 0 16px; font-size: clamp(2rem, 6vw, 4rem); line-height: 1; }
    small { color: #c5ea8f; font-weight: 700; letter-spacing: .14em; }
    .score { display: flex; gap: 16px; margin-bottom: 12px; }
    .score div { min-width: 78px; color: #d4dfd8; }
    output { display: block; color: #f7f6e9; font-size: 1.65rem; font-weight: 800; }
    canvas { display: block; width: 100%; aspect-ratio: 9 / 5; background: #e8ebd6;
      border-radius: 16px; touch-action: none; cursor: none; }
    .court-wrap { position: relative; }
    #event-banner { position: absolute; top: 8%; left: 50%; transform: translateX(-50%);
      z-index: 1; padding: 8px 15px; border-radius: 999px; color: #f7f6e9; background: #203a31;
      font-size: clamp(.75rem, 3vw, 1rem); font-weight: 800; white-space: nowrap; pointer-events: none; }
    [hidden] { display: none !important; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    #mode { background: #334445; color: #f7f6e9; }
    #status { margin: 0 0 10px; min-height: 1.5em; color: #d4dfd8; }
    footer { margin-top: 12px; color: #d4dfd8; }
    button { border: 0; border-radius: 8px; padding: 10px 16px; background: #c5ea8f;
      color: #182223; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <header>
    <div><small>STUDIYO / ARCADE BADMINTON</small><h1>Odd Birdle</h1></div>
    <div class="score" id="match-score">
      <div>나<output id="player-score">0</output></div>
      <div>CPU<output id="cpu-score">0</output></div>
    </div>
    <div class="score" id="practice-score" hidden>
      <div>콤보<output id="combo" aria-live="off">0</output></div>
      <div>최고<output id="best" aria-live="off">0</output></div>
    </div>
  </header>
  <p id="status" role="status"></p>
  <div class="court-wrap">
    <canvas id="court" aria-label="마우스나 손가락으로 셔틀을 받아치는 배드민턴 코트"></canvas>
    <div id="event-banner" role="status" hidden></div>
  </div>
  <footer>
    <span>가만히 닿으면 살짝 튕겨요. 원하는 방향으로 휘두르세요. 아래로 내리치면 스파이크!</span>
    <div class="actions">
      <button id="mode" type="button">연습장</button>
      <button id="restart" type="button">다시 시작</button>
    </div>
  </footer>
</main>
<script type="module">
  const court = document.querySelector('#court');
  const ctx = court.getContext('2d');
  const status = document.querySelector('#status');
  const eventBanner = document.querySelector('#event-banner');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const modeButton = document.querySelector('#mode');
  const scoreLabels = {
    player: document.querySelector('#player-score'),
    cpu: document.querySelector('#cpu-score')
  };
  const comboLabel = document.querySelector('#combo');
  const bestLabel = document.querySelector('#best');
  // Vertices are shared by the renderer and collision checks.
  const shapes = [
    [[0, -1], [0.94, 0.76], [-0.94, 0.76]],
    Array.from({ length: 32 }, (_, i) => {
      const angle = i * Math.PI / 16;
      return [Math.cos(angle), Math.sin(angle)];
    }),
    [[-0.72, -0.72], [0.72, -0.72], [0.72, 0.72], [-0.72, 0.72]],
    [[-1.38, -0.30], [1.38, -0.30], [1.38, 0.30], [-1.38, 0.30]],
    [[0, -1.13], [0.75, 0], [0, 1.13], [-0.75, 0]],
    [[-0.88, -0.50], [0, -1], [0.88, -0.50], [0.88, 0.50], [0, 1], [-0.88, 0.50]],
    [[-0.9, -0.85], [-0.23, -0.85], [0, -0.18], [0.23, -0.85],
      [0.9, -0.85], [0.4, 0.45], [0, 0.95], [-0.4, 0.45]]
  ];
  const width = 900;
  const height = 500;
  const center = width / 2;
  const floor = 448;
  const netTop = 342;
  const netStart = { x: center, y: netTop };
  const netEnd = { x: center, y: floor };
  const leftLine = 64;
  const rightLine = width - leftLine;
  const racketRadius = 22;
  const gravity = 760;
  const airDrag = 0.6;
  const step = 1 / 120;
  const pointsToWin = 7;
  const effects = [
    { id: 'shock', label: '충격', duration: 0.55 },
    { id: 'invisible', label: '1초 투명', duration: 1 },
    { id: 'wind', label: '돌풍', duration: 0.65 },
    { id: 'balloon', label: '벌룬', duration: 2 }
  ];

  let practice = false;
  let score;
  let combo = 0;
  let best = 0;
  let shape = -1;
  let shuttle;
  let outline;
  let racket;
  let cpu;
  let server;
  let lastHitter;
  let phase;
  let phaseTime;
  let hitCooldown;
  let touchingPlayer;
  let flash;
  let lastFrame;
  let accumulator = 0;
  let eventWait;
  let countdown;
  let pendingEffect;
  let activeEffect;
  let cpuPrediction;

  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const opponent = (side) => side === 'player' ? 'cpu' : 'player';

  function resize() {
    const bounds = court.getBoundingClientRect();
    const ratio = Math.min(devicePixelRatio || 1, 2);
    court.width = Math.round(bounds.width * ratio);
    court.height = Math.round(bounds.height * ratio);
    ctx.setTransform(court.width / width, 0, 0, court.height / height, 0, 0);
    racket = undefined;
  }

  function serve() {
    shape = shape < 0
      ? Math.floor(Math.random() * shapes.length)
      : (shape + 1 + Math.floor(Math.random() * (shapes.length - 1))) % shapes.length;
    const x = practice ? width * (0.36 + Math.random() * 0.28) : server === 'player' ? 245 : 660;
    shuttle = { x, y: 56, vx: 0, vy: 35, angle: 0, spin: 0.8, size: 13 + Math.random() * 16 };
    updateOutline();
    cpu = { x: 660, y: 300 };
    phase = 'live';
    lastHitter = undefined;
    hitCooldown = 0;
    touchingPlayer = false;
    flash = 0;
    combo = 0;
    comboLabel.value = combo;
    status.textContent = practice ? '셔틀을 연속으로 띄워 보세요.' : server === 'player' ? '내 서브 · 떨어지는 셔틀을 받아치세요' : 'CPU 서브';
  }

  function restart() {
    score = { player: 0, cpu: 0 };
    scoreLabels.player.value = 0;
    scoreLabels.cpu.value = 0;
    server = 'player';
    pendingEffect = undefined;
    clearEffect();
    scheduleEvent();
    serve();
  }

  function finishPoint(winner, reason) {
    if (practice) {
      phase = 'between';
      phaseTime = 0.55;
      return;
    }

    clearEffect();
    updateOutline();
    scoreLabels[winner].value = ++score[winner];
    server = winner;
    if (score[winner] === pointsToWin) {
      phase = 'finished';
      status.textContent = winner === 'player' ? '승리! 다시 시작으로 한 경기 더' : 'CPU 승리 · 다시 시작으로 재도전';
      return;
    }
    phase = 'between';
    phaseTime = 0.85;
    status.textContent = reason + ' · ' + (winner === 'player' ? '내 득점' : 'CPU 득점');
  }

  function showEvent(message) {
    if (eventBanner.textContent !== message) eventBanner.textContent = message;
    eventBanner.hidden = !message;
  }

  function scheduleEvent() {
    eventWait = 3 + Math.random() * 4;
  }

  function clearEffect() {
    activeEffect = undefined;
    cpuPrediction = undefined;
    showEvent('');
  }

  function startEffect() {
    activeEffect = { ...pendingEffect, remaining: pendingEffect.duration };
    pendingEffect = undefined;
    switch (activeEffect.id) {
      case 'shock':
        shuttle.vx = 0;
        shuttle.vy = Math.max(0, shuttle.vy) + 135;
        break;
      case 'invisible':
        cpuPrediction = { x: shuttle.x, y: shuttle.y, vx: shuttle.vx, vy: shuttle.vy };
        flash = 0;
        break;
      case 'wind':
        shuttle.vx = clamp(shuttle.vx + activeEffect.direction * 290, -1800, 1800);
        break;
    }
    showEvent(activeEffect.label);
    scheduleEvent();
  }

  function updateEvent(dt) {
    if (practice) return;
    if (activeEffect) {
      activeEffect.remaining -= dt;
      if (activeEffect.remaining <= 1e-9) clearEffect();
      return;
    }
    // Short points still contribute. Only the live rally advances the timer.
    if (!lastHitter) return;
    if (!pendingEffect) {
      eventWait -= dt;
      if (eventWait > 0) return;
      pendingEffect = { ...effects[Math.floor(Math.random() * effects.length)] };
      if (pendingEffect.id === 'wind') {
        pendingEffect.direction = Math.random() < 0.5 ? -1 : 1;
        pendingEffect.label += pendingEffect.direction < 0 ? ' ←' : ' →';
      }
      countdown = 3;
    } else {
      countdown -= dt;
    }
    if (countdown <= 1e-9) startEffect();
    else showEvent(pendingEffect.label + ' · ' + Math.ceil(countdown - 1e-9));
  }

  function flightScale(time) {
    return -Math.expm1(-airDrag * time) / airDrag;
  }

  function velocityToLandAt(targetX, vy) {
    const landingY = floor - Math.max(...outline.map(point => point.y));
    let low = 0;
    let high = 3;
    for (let i = 0; i < 12; i++) {
      const time = (low + high) / 2;
      const terminalVelocity = gravity / airDrag;
      const y = shuttle.y + terminalVelocity * time + (vy - terminalVelocity) * flightScale(time);
      if (y < landingY) low = time;
      else high = time;
    }
    return (targetX - shuttle.x) / flightScale(high);
  }

  function launch(vx, vy, hitter) {
    shuttle.vx = vx;
    shuttle.vy = vy;
    shuttle.spin = vx / 92 + 1.4;
    lastHitter = hitter;
    hitCooldown = 0.14;
    flash = 0.22;
    if (!practice) status.textContent = '랠리 중 · 먼저 7점';
  }

  function playerHit(swingX, swingY) {
    const speed = Math.hypot(swingX, swingY);
    const lift = 130 * (1 - clamp(speed / 400, 0, 1));
    launch(clamp(swingX * 0.92, -1800, 1800),
      clamp(swingY * 0.82 - lift, -880, 1100), 'player');
    if (practice) {
      comboLabel.value = ++combo;
      best = Math.max(best, combo);
      bestLabel.value = best;
    }
  }

  function onPlayerSide() {
    return practice || shuttle.x < center;
  }

  function updateOutline() {
    const size = shuttle.size * (activeEffect?.id === 'balloon' ? 2 : 1);
    const cos = Math.cos(shuttle.angle);
    const sin = Math.sin(shuttle.angle);
    outline = shapes[shape].map(([x, y]) => ({
      x: (x * cos - y * sin) * size,
      y: (x * sin + y * cos) * size
    }));
  }

  function pointSegmentDistanceSquared(point, from, to) {
    const dx = to.x - from.x;
    const dy = to.y - from.y;
    const lengthSquared = dx * dx + dy * dy;
    const t = lengthSquared === 0 ? 0 : clamp(
      ((point.x - from.x) * dx + (point.y - from.y) * dy) / lengthSquared, 0, 1
    );
    return (point.x - from.x - dx * t) ** 2 + (point.y - from.y - dy * t) ** 2;
  }

  function cross(from, to, point) {
    return (to.x - from.x) * (point.y - from.y) - (to.y - from.y) * (point.x - from.x);
  }

  function outlineContact(from, to, radius, x = shuttle.x, y = shuttle.y) {
    const start = { x: from.x - x, y: from.y - y };
    const end = { x: to.x - x, y: to.y - y };
    const radiusSquared = radius * radius;
    let inside = false;
    for (let i = 0; i < outline.length; i++) {
      const a = outline[i];
      const b = outline[(i + 1) % outline.length];
      if ((a.y > start.y) !== (b.y > start.y) &&
          start.x < a.x + (b.x - a.x) * (start.y - a.y) / (b.y - a.y)) {
        inside = !inside;
      }
      if (cross(start, end, a) * cross(start, end, b) < 0 &&
          cross(a, b, start) * cross(a, b, end) < 0) return true;
      if (pointSegmentDistanceSquared(a, start, end) <= radiusSquared ||
          pointSegmentDistanceSquared(start, a, b) <= radiusSquared ||
          pointSegmentDistanceSquared(end, a, b) <= radiusSquared) return true;
    }
    return inside;
  }

  function racketContact(from, to) {
    return outlineContact(from, to, racketRadius);
  }

  function checkPlayerContact(from, to, swingX, swingY) {
    const touching = onPlayerSide() && racketContact(to, to);
    if (phase === 'live' && onPlayerSide() && hitCooldown <= 0 &&
        !touchingPlayer && racketContact(from, to)) {
      playerHit(swingX, swingY);
      touchingPlayer = touching;
    } else if (!touching) {
      touchingPlayer = false;
    }
  }

  function moveRacket(event) {
    if (!event.isPrimary || (event.pointerType !== 'mouse' && event.buttons === 0)) return;
    const bounds = court.getBoundingClientRect();
    const maxX = practice ? width : center - racketRadius;
    const next = {
      x: clamp((event.clientX - bounds.left) * width / bounds.width, 0, maxX),
      y: clamp((event.clientY - bounds.top) * height / bounds.height, 0, floor),
      time: event.timeStamp,
      vx: 0,
      vy: 0,
      age: 0
    };
    const previous = racket ?? next;
    const elapsed = Math.max(8, next.time - previous.time) / 1000;
    next.vx = (next.x - previous.x) / elapsed;
    next.vy = (next.y - previous.y) / elapsed;
    racket = next;
    checkPlayerContact(previous, next, next.vx, next.vy);
  }

  function moveCpu(dt) {
    const tracked = cpuPrediction ?? shuttle;
    const defending = tracked.x >= center && tracked.vy > 0;
    const targetX = defending ? clamp(tracked.x, center + racketRadius, rightLine - 24) : 660;
    const targetY = defending ? clamp(tracked.y + 24, 205, floor - 14) : 300;
    cpu.x += clamp(targetX - cpu.x, -290 * dt, 290 * dt);
    cpu.y += clamp(targetY - cpu.y, -340 * dt, 340 * dt);
    if (defending && tracked.x <= rightLine && shuttle.x >= center && shuttle.x <= rightLine &&
        lastHitter !== 'cpu' && hitCooldown <= 0 &&
        racketContact(cpu, cpu)) {
      const vy = -485 - Math.random() * 45;
      launch(velocityToLandAt(160 + Math.random() * 165, vy), vy, 'cpu');
    }
  }

  function advanceFlight(body, dt, drag) {
    body.vx *= drag;
    body.vy = body.vy * drag + gravity * dt;
    body.x += body.vx * dt;
    body.y += body.vy * dt;
  }

  function simulate(dt) {
    if (phase === 'finished') return;
    if (phase === 'between') {
      phaseTime -= dt;
      if (phaseTime <= 0) serve();
      return;
    }

    updateEvent(dt);
    hitCooldown = Math.max(0, hitCooldown - dt);
    flash = Math.max(0, flash - dt);
    const previousX = shuttle.x;
    const previousY = shuttle.y;
    const drag = Math.exp(-airDrag * dt);
    advanceFlight(shuttle, dt, drag);
    if (cpuPrediction) advanceFlight(cpuPrediction, dt, drag);
    shuttle.angle += shuttle.spin * dt;
    updateOutline();
    const left = Math.min(...outline.map(point => point.x));
    const right = Math.max(...outline.map(point => point.x));
    const bottom = Math.max(...outline.map(point => point.y));

    if (practice) {
      if (shuttle.x + left < 0 || shuttle.x + right > width) {
        shuttle.x = clamp(shuttle.x, -left, width - right);
        shuttle.vx *= -0.65;
      }
    } else {
      const crossesCenter = (previousX - center) * (shuttle.x - center) < 0;
      const crossesNet = crossesCenter && outlineContact(netStart, netEnd, 2, center,
        previousY + (shuttle.y - previousY) * (center - previousX) / (shuttle.x - previousX));
      if (lastHitter && (crossesNet || outlineContact(netStart, netEnd, 2))) {
        finishPoint(opponent(lastHitter), '네트');
        return;
      }
      if (lastHitter && (shuttle.x + right < 0 || shuttle.x + left > width)) {
        shuttle.x = clamp(shuttle.x, -left, width - right);
        finishPoint(opponent(lastHitter), '아웃');
        return;
      }
    }

    if (shuttle.y + bottom >= floor) {
      shuttle.y = floor - bottom;
      const out = shuttle.x < leftLine || shuttle.x > rightLine;
      const landingSide = shuttle.x < center ? 'player' : 'cpu';
      finishPoint(out ? opponent(lastHitter ?? server) : opponent(landingSide), out ? '아웃' : '착지');
      return;
    }

    if (racket) {
      racket.age += dt;
      const remainingSwing = Math.max(0, 1 - racket.age / 0.085);
      checkPlayerContact(racket, racket, racket.vx * remainingSwing, racket.vy * remainingSwing);
    }
    if (!practice) moveCpu(dt);
  }

  function drawRacket(position, fill, stroke) {
    ctx.beginPath();
    ctx.arc(position.x, position.y, racketRadius, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = stroke;
    ctx.stroke();
  }

  function drawCourt() {
    ctx.fillStyle = '#e8ebd6';
    ctx.fillRect(0, 0, width, height);
    ctx.fillStyle = '#c0cbb4';
    ctx.fillRect(0, floor, width, height - floor);
    ctx.fillStyle = '#6d8e72';
    ctx.fillRect(practice ? 0 : leftLine, floor, practice ? width : rightLine - leftLine, 8);
    if (practice) return;

    ctx.fillStyle = '#476755';
    ctx.fillRect(center - 2, netTop, 4, floor - netTop);
    ctx.fillRect(center - 9, netTop, 18, 4);
    ctx.fillStyle = '#f7f6e9';
    for (const x of [leftLine, center, rightLine]) ctx.fillRect(x - 2, floor, 4, 8);
    ctx.font = '700 16px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('YOU', center / 2, 475);
    ctx.fillText('CPU', center * 1.5, 475);
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);
    ctx.save();
    if (activeEffect?.id === 'shock' && !reduceMotion.matches) {
      const t = activeEffect.remaining;
      ctx.translate(Math.sin(t * 91) * 17 * t, Math.cos(t * 117) * 12 * t);
    }
    drawCourt();
    if (!practice) drawRacket(cpu, '#cf936b99', '#774935');
    if (racket) drawRacket(racket, '#a9d67877', '#274d3b');

    if (!cpuPrediction) drawShuttle();
    ctx.restore();
  }

  function drawShuttle() {
    if (flash > 0 && phase === 'live') {
      ctx.beginPath();
      ctx.arc(shuttle.x, shuttle.y, 26 + (0.22 - flash) * 105, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(33, 102, 64, ' + flash / 0.22 + ')';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.beginPath();
    outline.forEach((point, index) => {
      const x = shuttle.x + point.x;
      const y = shuttle.y + point.y;
      if (index === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = phase === 'live' ? '#274d3b' : '#667165';
    ctx.fill();
  }

  function frame(time) {
    if (lastFrame !== undefined) accumulator += Math.min((time - lastFrame) / 1000, 0.05);
    lastFrame = time;
    while (accumulator >= step) {
      simulate(step);
      accumulator -= step;
    }
    draw();
    requestAnimationFrame(frame);
  }

  function clearRacket() {
    racket = undefined;
    touchingPlayer = false;
  }

  court.addEventListener('pointerenter', (event) => {
    if (event.pointerType === 'mouse') moveRacket(event);
  });
  court.addEventListener('pointermove', moveRacket);
  court.addEventListener('pointerdown', moveRacket);
  for (const event of ['pointerleave', 'pointercancel', 'lostpointercapture']) {
    court.addEventListener(event, clearRacket);
  }
  court.addEventListener('pointerup', (event) => {
    if (event.pointerType !== 'mouse') clearRacket();
  });
  modeButton.addEventListener('click', () => {
    practice = !practice;
    modeButton.textContent = practice ? '경기장' : '연습장';
    document.querySelector('#match-score').hidden = practice;
    document.querySelector('#practice-score').hidden = !practice;
    clearRacket();
    restart();
  });
  document.querySelector('#restart').addEventListener('click', restart);
  resize();
  restart();
  new ResizeObserver(resize).observe(court);
  requestAnimationFrame(frame);
</script>
</body>
</html>

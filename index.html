<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ODD BIRDLE</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@650&amp;display=swap">
  <style>
    :root { --page: #182223; --court: #e8ebd6; --ink: #274d3b;
      --page-hover: #293737; --court-hover: #d7dec6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center;
      background: var(--page); font: 16px "Space Grotesk", system-ui, sans-serif; }
    main { width: min(940px, 100% - 32px); padding-block: 24px; }
    @media (orientation: landscape) and (pointer: coarse) {
      main { width: min(940px, 100% - 24px, calc((100svh - 64px) * 1.8)); padding-block: 6px; }
    }
    h1 { position: absolute; top: 17%; left: 50%; transform: translate(-50%, -50%);
      margin: 0; color: var(--ink); text-align: center; white-space: nowrap; pointer-events: none;
      font-size: clamp(2rem, 8vw, 5rem); font-weight: 650; line-height: 1; letter-spacing: -.04em; }
    #stage { position: relative; }
    #stage:not([data-phase="ready"]) h1 { display: none; }
    #studio-link { display: grid; place-items: center; width: 44px; height: 44px;
      margin: 8px auto 0; color: var(--court); }
    #studio-link:hover { background: var(--page-hover); }
    #studio-link:focus-visible { outline: 2px solid currentColor; outline-offset: -3px; }
    canvas { display: block; width: 100%; aspect-ratio: 9 / 5; background: var(--court);
      touch-action: none; cursor: none; }
    #stage[data-phase="ready"] canvas, #stage[data-phase="finished"] canvas { cursor: default; }
    #score { position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%);
      color: var(--ink); opacity: .45; font-size: clamp(1.5rem, 6vw, 3.5rem); font-weight: 650; line-height: 1;
      font-variant-numeric: tabular-nums; pointer-events: none; }
    #stage[data-phase="ready"] #score, #stage[data-phase="finished"] #score { opacity: 1; }
    #side-label { position: absolute; top: 5%; left: 25%; transform: translateX(-50%);
      color: var(--ink); font-size: clamp(.65rem, 1.7vw, .875rem); font-weight: 650;
      letter-spacing: .08em; pointer-events: none; }
    #side-label[data-side="right"] { left: 75%; }
    #winner { position: absolute; bottom: calc(50% + clamp(1rem, 5vw, 2.25rem)); left: 50%;
      transform: translateX(-50%); margin: 0; color: var(--ink);
      font-size: clamp(1rem, 3.8vw, 1.75rem); font-weight: 650; white-space: nowrap; pointer-events: none; }
    #event-banner { position: absolute; top: 7%; left: 50%; transform: translateX(-50%);
      color: var(--ink); background: var(--court); padding: 3px 7px;
      font-size: clamp(1.25rem, 5.5vw, 3.25rem); line-height: 1.05;
      font-weight: 650; white-space: nowrap; pointer-events: none; }
    #event-banner[data-wind] { font-size: clamp(1.4rem, 6vw, 3.6rem); }
    #game-control { position: absolute; top: 8px; right: 8px; display: grid; place-items: center;
      width: 44px; height: 44px; border: 0; background: var(--court); color: var(--ink); cursor: pointer; }
    #game-control:hover { background: var(--court-hover); }
    #game-control:focus-visible { outline: 2px solid currentColor; outline-offset: -3px; }
    #stage[data-phase="ready"] #game-control, #stage[data-phase="finished"] #game-control {
      top: calc(50% + clamp(1rem, 4vw, 2rem)); right: auto; left: 50%; transform: translateX(-50%); }
    #menu, #join-form, #room-display { position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); white-space: nowrap; }
    #menu, #join-form { display: flex; align-items: center; gap: clamp(4px, 2vw, 16px); }
    #join-form { flex-wrap: wrap; justify-content: center; width: min(96%, 420px); }
    #room-display { text-align: center; color: var(--ink); }
    #room-display > span { display: block; font-size: clamp(.75rem, 2vw, 1rem); }
    #room-code { display: block; font-size: clamp(1.6rem, 8vw, 4rem); font-weight: 650; letter-spacing: .12em; color: var(--ink); }
    #menu button, #join-form button, #back { border: 0; background: transparent;
      color: var(--ink); min-height: 44px; padding: 0 8px; font: inherit; font-weight: 650; cursor: pointer; }
    #menu button:hover, #join-form button:hover, #back:hover { background: var(--court-hover); }
    #join-form label { color: var(--ink); }
    #code-input { min-width: 0; width: 7.5em; background: transparent; border: 0; border-bottom: 1px solid var(--ink);
      color: var(--ink); text-transform: uppercase; font: inherit; }
    #back { position: absolute; top: 8px; left: 8px; min-width: 44px; }
    #lobby-message { position: absolute; top: 32%; width: 100%; margin: 0; text-align: center;
      color: var(--ink); font-size: .875rem; pointer-events: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <section id="stage" data-phase="ready" aria-label="Game">
    <h1>ODD BIRDLE</h1>
    <canvas id="court" aria-label="Badminton court. Use your pointer to hit the shuttle."></canvas>
    <output id="score" aria-label="Left and right scores" hidden>0:0</output>
    <span id="side-label" hidden>YOU</span>
    <p id="winner" role="status" hidden></p>
    <span id="status" class="sr-only" role="status"></span>
    <div id="event-banner" role="status" hidden></div>
    <nav id="menu" aria-label="Game mode">
      <button id="create" type="button">CREATE</button>
      <button id="join" type="button">JOIN</button>
      <button id="cpu" type="button">CPU</button>
    </nav>
    <div id="room-display" hidden>
      <span>Room code:</span>
      <output id="room-code" aria-label="Room code" aria-live="polite"></output>
    </div>
    <form id="join-form" novalidate hidden>
      <label for="code-input">Room code</label>
      <input id="code-input" maxlength="6" aria-describedby="lobby-message"
        autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Enter code">
      <button type="submit" aria-label="JOIN">→</button>
    </form>
    <p id="lobby-message" role="status" hidden></p>
    <button id="back" type="button" aria-label="Main menu" title="Main menu" hidden>←</button>
    <button id="game-control" type="button" aria-label="Restart" title="Restart" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 5v5h5M4.7 10a7.5 7.5 0 1 1 .7 7" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </section>
  <a id="studio-link" href="https://studiyo.pages.dev/" target="_blank" rel="noopener"
    aria-label="studiyo website (opens in a new tab)" title="studiyo website">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.6" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/>
      <ellipse cx="12" cy="12" rx="4" ry="9"/>
      <path d="M3 12h18"/>
    </svg>
  </a>
</main>
<script type="module" src="./client.js"></script>
</body>
</html>
